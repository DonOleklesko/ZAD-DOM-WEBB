<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <title>Elektro-Bud - Magazyn</title>
        <link rel="stylesheet" href="public/main.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="bg-dark">
        <div id="app" class="container bg-light min-vh-100 p-3" style="max-width: 700px;">
            <h1>Magazyn Elektro-Bud</h1>

            <h4 class="mt-3">Dodaj produkt</h4>
            <input type="text" id="productName" class="form-control mb-2" placeholder="Nazwa produktu"/>
            <input type="text" id="productCategory" class="form-control mb-2" placeholder="Kategoria"/>
            <input type="number" id="productQuantity" class="form-control mb-2" placeholder="Ilość" min="0"/>
            <input type="number" id="productPrice" class="form-control mb-2" placeholder="Cena (zł)" min="0" step="0.01"/>
            <button class="btn btn-success" type="button" id="productAddButton">Dodaj produkt</button>

            <h4 class="mt-4">Lista produktów</h4>
            <div id="productsContainer"></div>
        </div>

        <script src="public/main.js" defer></script>
    </body>
</html>
